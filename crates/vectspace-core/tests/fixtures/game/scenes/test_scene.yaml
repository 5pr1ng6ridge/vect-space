schema_version: 2
id: test_scene
entry: background_start
nodes:
  background_start:
    type: background
    background: bg.nvctsp
    transition:
      type: cross_fade
    duration_ms: 0
    easing: ease_in_out
    await: false
    next: sprite_choice_background_start
  choice_background_start:
    type: choice
    choices:
    - id: option_1
      label: 动画对话
      next: move_jelly_copy
    - id: option_2
      label: 选项二
      next: end
  end:
    type: end
  move_jelly_copy:
    type: timeline
    duration_ms: 650
    await: false
    skippable: false
    tracks:
    - type: sprite
      sprite_id: e
      asset: null
      remove_at_end: false
      channels:
        opacity:
        - at_ms: 0
          value: inherit
          easing: ease_in_out
        - at_ms: 650
          value: 1.0
          easing: linear
        scale:
        - at_ms: 0
          value: inherit
          easing: ease_in_out
        - at_ms: 650
          value: 1.05
          easing: linear
        x:
        - at_ms: 0
          value: inherit
          easing: ease_in_out
        - at_ms: 650
          value: 1470.0
          easing: linear
        "y":
        - at_ms: 0
          value: inherit
          easing: ease_in_out
        - at_ms: 650
          value: 1250.0
          easing: linear
        z:
        - at_ms: 0
          value: inherit
          easing: step
        - at_ms: 650
          value: 10.0
          easing: linear
    events: []
    next: say
  say:
    type: say
    speaker: e
    text: |
      test
    mode: start
    speed_cps: null
    next: end
  sprite_choice_background_start:
    type: sprite
    sprite_id: e
    action: show
    asset: sprite.jelly
    x: 960.0
    "y": 1080.0
    scale: 1.0
    opacity: 1.0
    z: 0
    duration_ms: 500
    easing: ease_in_out
    await: false
    next: choice_background_start

