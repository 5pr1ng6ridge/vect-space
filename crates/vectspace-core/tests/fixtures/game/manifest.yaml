schema_version: 2
content_version: demo-2
entry_scene: prologue
default_locale: zh-CN
variables:
  ending_seen:
    scope: profile
    type: boolean
    default: false
  route:
    scope: save
    type: string
    default: ""
  score:
    scope: save
    type: integer
    default: 0
characters:
  test:
    display_name: 测试角色
    name_color: "#1D5C78"
    text_color: "#17213A"
assets:
  bg.nvctsp:
    kind: background
    path: backgrounds/Photoshop_3a52oGnGn0.png
  bg.vector_space:
    kind: background
    path: backgrounds/bg_vstest.png
  bgm.test1:
    kind: bgm
    path: audio/test_bgm.ogg
  font.fusion_pixel:
    kind: font
    path: fonts/fusion-pixel-12px-monospaced-zh_hans.ttf
  gui.dialogue_box:
    kind: gui
    path: gui/diaboxtest.png
  gui.name_box:
    kind: gui
    path: gui/nameboxtest.png
  sfx.typing:
    kind: sfx
    path: audio/sfx_typing.wav
  sprite.jelly:
    kind: sprite
    path: sprites/jelly.png
  sprite.omo:
    kind: sprite
    path: sprites/omo.png
  video.test:
    kind: video
    path: videos/test_movie.mp4
scenes:
- scenes/prologue.yaml
- scenes/test_scene.yaml
- scenes/feature_lab.yaml
ui_motions:
- ui/motions/dialogue_slide_in.yaml
- ui/motions/dialogue_slide_out.yaml
- ui/motions/dialogue_emphasis.yaml
buttons:
- ui/buttons/choice_primary.yaml
- ui/buttons/choice_secondary.yaml
ui_motion_defaults:
  dialogue_show: ui.dialogue.slide_in
  dialogue_hide: ui.dialogue.slide_out
