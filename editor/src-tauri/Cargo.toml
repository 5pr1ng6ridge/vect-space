[package]
name = "vectspace-story-editor"
version = "0.1.0"
description = "Visual story graph editor for VECTSPACE"
authors = ["VECTSPACE contributors"]
edition = "2021"

[lib]
name = "vectspace_story_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1"
sha2 = "0.10"
# Host-side inspection keeps corrupt or renamed media out of the project
# without invoking external command-line tools.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
symphonia = { version = "0.5", features = ["aac", "flac", "mp3", "ogg", "vorbis", "wav"] }
mp4parse = "0.17"
ttf-parser = "0.25"
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.16"
vectspace-proof.workspace = true
vectspace-core.workspace = true
vectspace-protocol.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
