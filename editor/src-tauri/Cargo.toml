[package]
name = "vectspace-story-editor"
version = "0.1.0"
description = "Visual story graph editor for VECTSPACE"
authors = ["VECTSPACE contributors"]
edition = "2021"

[lib]
name = "vectspace_story_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"
vectspace-core = { path = "../../crates/vectspace-core" }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"

[dev-dependencies]
tempfile = "3"
