schema_version: 2
id: ambience_lab
entry: intro
# 可从章节地图进入的四通道环境声验收场景。四个固定槽位先同时建立，
# 再用时间线独立自动化、同素材保留播放头的 retune、跨素材替换和单槽停止
# 验证共享运行时生命周期。四个 WAV 夹具由 npm run assets:ambience 生成。
nodes:
  intro:
    type: say
    speaker: test
    text: |-
      环境声实验室：四个固定声道会同时运行。接下来会独立调节，先对 slot_2 的同一素材
      改循环参数但保留播放头，再跨素材替换并停止其中的声道，不影响 BGM、音效或其它环境声。
    mode: start
    speed_cps: null
    next: start_slot_1
  start_slot_1:
    type: ambience
    slot: slot_1
    action: start
    asset: ambience.birds
    volume: 0.65
    start_ms: 0
    duration_ms: 280
    await: true
    next: start_slot_2
  start_slot_2:
    type: ambience
    slot: slot_2
    action: start
    asset: ambience.rain
    volume: 0.5
    start_ms: 0
    duration_ms: 280
    await: true
    next: start_slot_3
  start_slot_3:
    type: ambience
    slot: slot_3
    action: start
    asset: ambience.intro
    volume: 0.42
    start_ms: 0
    duration_ms: 280
    await: true
    next: start_slot_4
  start_slot_4:
    type: ambience
    slot: slot_4
    action: start
    asset: ambience.demo
    volume: 0.32
    start_ms: 0
    duration_ms: 280
    await: true
    next: mix_timeline
  mix_timeline:
    type: timeline
    duration_ms: 1200
    await: true
    skippable: true
    tracks:
    - type: ambience
      slot: slot_1
      channels:
        volume:
        - at_ms: 0
          value: 0.65
          easing: linear
        - at_ms: 1200
          value: 0.22
          easing: ease_in_out
    - type: ambience
      slot: slot_2
      channels:
        volume:
        - at_ms: 0
          value: 0.5
          easing: linear
        - at_ms: 600
          value: 0.18
          easing: ease_in
        - at_ms: 1200
          value: 0.5
          easing: ease_out
    - type: ambience
      slot: slot_3
      channels:
        volume:
        - at_ms: 0
          value: 0.42
          easing: linear
        - at_ms: 1200
          value: 0.08
          easing: ease_in
    - type: ambience
      slot: slot_4
      channels:
        volume:
        - at_ms: 0
          value: 0.32
          easing: linear
        - at_ms: 1200
          value: 0.58
          easing: ease_out
    events: []
    next: retune_slot_2
  retune_slot_2:
    type: ambience
    slot: slot_2
    action: start
    asset: ambience.rain
    volume: 0.36
    # The generated WAV is exactly 1000ms; 200..800ms is a bounded,
    # phase-aligned loop and 760ms makes a reset distinguishable in diagnostics.
    start_ms: 760
    loop_start_ms: 200
    loop_end_ms: 800
    duration_ms: 0
    await: true
    next: replace_slot_2
  replace_slot_2:
    type: ambience
    slot: slot_2
    action: start
    asset: ambience.birds
    volume: 0.38
    start_ms: 0
    duration_ms: 450
    await: true
    next: stop_slot_3
  stop_slot_3:
    type: ambience
    slot: slot_3
    action: stop
    duration_ms: 320
    await: true
    next: stop_slot_4
  stop_slot_4:
    type: ambience
    slot: slot_4
    action: stop
    duration_ms: 320
    await: true
    next: closing
  closing:
    type: say
    speaker: test
    text: 四通道环境声演示结束；slot_2 先以同素材保留播放头 retune，再替换为 birds；slot_1 与 slot_2 仍保留到场景边界，离开时会统一清理。
    mode: start
    speed_cps: null
    next: end
  end:
    type: end
