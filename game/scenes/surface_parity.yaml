schema_version: 2
id: surface_parity
entry: stage
nodes:
  alli_show:
    type: sprite
    sprite_id: alli
    action: show
    character: alli
    expression: neutral
    x: 620.0
    "y": 1040.0
    scale: 0.78
    opacity: 1.0
    z: 10
    duration_ms: 300
    easing: ease_out
    await: true
    next: camera_push
  camera_push:
    type: camera
    x: -20.0
    "y": 0.0
    zoom: 1.06
    duration_ms: 240
    easing: ease_in_out
    await: true
    next: stage_timeline
  end:
    type: end
  frames_timeline:
    type: timeline
    duration_ms: 600
    await: true
    skippable: true
    tracks:
    - type: sprite
      sprite_id: prop
      asset: sprite.stopmotion
      remove_at_end: false
      channels:
        x:
        - at_ms: 0
          value: 900.0
          easing: linear
        - at_ms: 600
          value: 1020.0
          easing: ease_in_out
    events: []
    next: video_timeline
  settle:
    type: wait
    duration_ms: 240
    next: end
  stage:
    type: background
    background: bg.vector_space
    transition: cross_fade
    duration_ms: 300
    easing: ease_in_out
    await: true
    next: alli_show
  stage_timeline:
    type: timeline
    duration_ms: 640
    await: true
    skippable: true
    tracks:
    - type: sprite
      sprite_id: alli
      asset: sprite.alli_neutral
      remove_at_end: false
      channels:
        x:
        - at_ms: 0
          value: inherit
          easing: linear
        - at_ms: 640
          value: 820.0
          easing: ease_in_out
        "y":
        - at_ms: 0
          value: inherit
          easing: linear
        - at_ms: 640
          value: 1010.0
          easing: ease_in_out
    - type: camera
      channels:
        x:
        - at_ms: 0
          value: inherit
          easing: linear
        - at_ms: 640
          value: 0.0
          easing: ease_in_out
        "y":
        - at_ms: 0
          value: inherit
          easing: linear
        - at_ms: 640
          value: 0.0
          easing: ease_in_out
        zoom:
        - at_ms: 0
          value: inherit
          easing: linear
        - at_ms: 640
          value: 1.0
          easing: ease_out
    events:
    - type: screen_effect
      id: parity_flash
      at_ms: 320
      effect: flash
      duration_ms: 120
    - type: screen_effect
      id: parity_shake
      at_ms: 320
      effect: shake
      duration_ms: 200
    next: frames_timeline
  video_timeline:
    type: timeline
    duration_ms: 1600
    await: true
    skippable: true
    tracks:
    - type: video
      asset: video.test
      clip_start_ms: 0
      clip_end_ms: 4000
      loop: false
      fit: contain
      audio_enabled: false
      channels:
        height:
        - at_ms: 0
          value: 900.0
          easing: linear
        opacity:
        - at_ms: 0
          value: 1.0
          easing: linear
        width:
        - at_ms: 0
          value: 1600.0
          easing: linear
        x:
        - at_ms: 0
          value: 160.0
          easing: linear
        "y":
        - at_ms: 0
          value: 90.0
          easing: linear
        z:
        - at_ms: 0
          value: 100.0
          easing: step
    events: []
    next: settle
