    steps:
    - id: step_1
      text: |-
        要证：
        $$
        \frac{a_1+\cdots+a_n}{n}\ge \sqrt[n]{a_1a_2\cdots a_n}
        $$
        也就是算术平均数大于等于几何平均数。
        一个很初等的证明方法叫 归纳加“均匀化”。
      page_break_before: false
    - id: step_2
      text: |-
        第一步：两个数的情况
        对正数 $x,y$，
        $$
        \frac{x+y}{2}\ge \sqrt{xy}
        $$
        因为
        $$
        x+y-2\sqrt{xy}=(\sqrt{x}-\sqrt{y})^2\ge 0
        $$
        所以二元均值不等式成立。
      page_break_before: false
    - id: step_3
      text: |-
        第二步：$2^k$ 个数的情况
        先证明项数是 $2^k$ 时成立。
        当 $n=2$ 已经成立。
        假设 $n=2^k$ 时成立。现在证明 $n=2^{k+1}$。
        设有 $2^{k+1}$ 个正数：
        $$
        a_1,\dots,a_{2^{k+1}}
        $$
        把它们分成两半：
        $$
        a_1,\dots,a_{2^k}
        $$
        和
        $$
        a_{2^k+1},\dots,a_{2^{k+1}}
        $$
      page_break_before: false
    - id: step_4
      text: |-
        由归纳假设，
        $$
        \frac{a_1+\cdots+a_{2^k}}{2^k}
        \ge
        \sqrt[2^k]{a_1\cdots a_{2^k}}
        $$
        以及
        $$
        \frac{a_{2^k+1}+\cdots+a_{2^{k+1}}}{2^k}
        \ge
        \sqrt[2^k]{a_{2^k+1}\cdots a_{2^{k+1}}}
        $$
        记这两个算术平均数为 $A_1,A_2$，两个几何平均数为 $G_1,G_2$。
        于是
        $$
        A_1\ge G_1,\qquad A_2\ge G_2
        $$
        整体的算术平均数是
        $$
        A=\frac{A_1+A_2}{2}
        $$
      page_break_before: false
    - id: step_5
      text: |-
        所以由二元均值不等式，
        $$
        A=\frac{A_1+A_2}{2}\ge \sqrt{A_1A_2}\ge \sqrt{G_1G_2}
        $$
        而
        $$
        \sqrt{G_1G_2}

        \sqrt[2^{k+1}]{a_1a_2\cdots a_{2^{k+1}}}
        $$
        所以 $2^{k+1}$ 项时也成立。
        因此对所有 $2^k$ 项，$A\ge G$ 成立。
      page_break_before: false
    - id: step_7
      text: |-
        第三步：推广到任意 $n$
        这个技巧很漂亮喵。
        设
        $$
        A=\frac{a_1+\cdots+a_n}{n}
        $$
        我们想证：
        $$
        A\ge \sqrt[n]{a_1\cdots a_n}
        $$
      page_break_before: false
    - id: step_8
      text: |-
        取一个 $2^k\ge n$。然后补上 $2^k-n$ 个数，全部取为 $A$。
        于是这 $2^k$ 个数是：
        $$
        a_1,\dots,a_n,\underbrace{A,\dots,A}_{2^k-n\text{个}}
        $$
        它们的算术平均数仍然是 $A$，因为总和为
        $$
        a_1+\cdots+a_n+(2^k-n)A

        nA+(2^k-n)A

        2^kA
        $$
        所以这 $2^k$ 个数的平均数是 $A$。
      page_break_before: false
    - id: step_9
      text: |-
        由 $2^k$ 项的均值不等式，
        $$
        A\ge \sqrt[2^k]{a_1a_2\cdots a_n A^{2^k-n}}
        $$
        两边取 $2^k$ 次方：
        $$
        A^{2^k}\ge a_1a_2\cdots a_n A^{2^k-n}
        $$
        因为 $A>0$，所以两边除以 $A^{2^k-n}$，得到
        $$
        A^n\ge a_1a_2\cdots a_n
        $$
        也就是
        $$
        A\ge \sqrt[n]{a_1a_2\cdots a_n}
        $$
        证毕喵。
        等号成立当且仅当
        $$
        a_1=a_2=\cdots=a_n
        $$
      page_break_before: false
    speed_cps: null
    next: long_text_say
  long_text_say:
    type: long_text
    paper: gui.scratch_paper
    steps:
    - id: step_1
      text: |-
        高中里的加法原理大概说：
        如果一件事可以分成互不重叠的两类，第一类有 $m$ 种，第二类有 $n$ 种，那么总共有 $m+n$ 种。
      page_break_before: false
    - id: step_2
      text: |-
        在 ZFC 里，它变成这个定理：
        $$A\cap B=\varnothing,\ |A|=m,\ |B|=n\implies |A\cup B|=m+n$$
        或者更干净地，用不交并：
        $$A\sqcup B=({0}\times A)\cup({1}\times B)$$
        这样即使原本 $A,B$ 有交集，也可以用标签把它们区分开。
        于是定义有限基数加法：
        $$m+n=|m\sqcup n|$$
      page_break_before: false
    - id: step_3
      text: |-
        那么如果 $|A|=m, |B|=n$，就能构造双射：
        $$m\sqcup n\to A\sqcup B$$
        所以：
        $$|A\sqcup B|=m+n$$
        这就是“分类计数”的 ZFC 版本喵。
      page_break_before: false
    - id: step_4
      text: "1234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890"
      page_break_before: false
