      page_break_before: false
    - id: step_3
      text: |-
        设 $X_1,X_2,\dots$ 独立同分布，且
        
        $$\mathbb E X_i=\mu,\qquad \operatorname{Var}(X_i)=\sigma^2<\infty,\quad \sigma>0$$
        
        那么
        
        $$\frac{X_1+\cdots+X_n-n\mu}{\sigma\sqrt n}\xrightarrow{d}N(0,1)$$
      page_break_before: false
