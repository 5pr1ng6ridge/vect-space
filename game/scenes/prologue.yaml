schema_version: 2
id: prologue
entry: establish
nodes:
  algebra_line:
    type: say
    speaker: test
    text: 若 $A$ 可逆，则每个 $b$ 都有唯一解 $x=A^{-1}b$。[pause=350ms] 这是同一事实的代数表述。
    speed_cps: null
    next: flash_result
  award_geometry:
    type: set
    variable: score
    op: add
    value: 1
    next: route_branch
  camera_move:
    type: camera
    x: -40.0
    "y": -20.0
    zoom: 1.05
    duration_ms: 500
    easing: ease_in_out
    await: true
    next: conclusion
  choose_algebra:
    type: set
    variable: route
    op: assign
    value: algebra
    next: route_branch
  choose_geometry:
    type: set
    variable: route
    op: assign
    value: geometry
    next: award_geometry
  choose_test:
    type: set
    variable: route
    op: assign
    value: test
    next: say_2
  conclusion:
    type: say
    speaker: 系统
    text: 分支已经汇合。读档只恢复这个最终世界，不会重放刚才的转场、音效、闪光或镜头运动。
    speed_cps: 32.0
    next: mark_ending
  ending:
    type: jump
    scene: null
    target: route_choice
  enter_jelly:
    type: sprite
    sprite_id: jelly
    action: show
    asset: sprite.jelly
    x: 420.0
    "y": 1150.0
    scale: 1.2
    opacity: 1.0
    z: 10
    duration_ms: 550
    easing: ease_out
    await: false
    next: introduction
  establish:
    type: background
    background: bg.vector_space
    transition: cross_fade
    duration_ms: 700
    easing: ease_in_out
    await: true
    next: say
  flash_result:
    type: screen_effect
    effect: flash
    duration_ms: 260
    await: false
    next: camera_move
  geometry_line:
    type: say
    speaker: test
    text: 非零行列式意味着线性变换不压扁空间；[fx=glow]体积缩放因子[/fx]是 $|\det(A)|$。
    speed_cps: null
    next: flash_result
  introduction:
    type: say
    speaker: test
    text: >-
      这里是固定的$1920\times1080$舞台。公式$V=\operatorname{span}\{v_1,v_2\}$会先完成排版，再逐个显示。当前分数为
      $[var=score]$。
    speed_cps: 28.0
    next: move_jelly
  mark_ending:
    type: set
    variable: ending_seen
    op: assign
    value: true
    next: ending
  move_jelly:
    type: sprite
    sprite_id: jelly
    action: move
    asset: null
    x: 1470.0
    "y": 1250.0
    scale: 1.05
    opacity: 1.0
    z: 10
    duration_ms: 650
    easing: ease_in_out
    await: true
    next: route_choice
  route_branch:
    type: condition
    condition:
      op: or
      conditions:
      - op: eq
        left:
          variable: route
        right:
          value: geometry
      - op: and
        conditions:
        - op: ne
          left:
            variable: route
          right:
            value: algebra
        - op: not
          condition:
            op: eq
            left:
              variable: route
            right:
              value: test
    then: geometry_line
    otherwise: algebra_line
  route_choice:
    type: choice
    choices:
    - id: geometry
      label: 观察几何意义（当前 [var=score] 分）：$\det(A)\neq0$
      next: choose_geometry
      visible_if:
        op: eq
        left:
          variable: ending_seen
        right:
          value: true
    - id: algebra
      label: 从代数关系出发：$Ax=b$
      next: choose_algebra
      enabled_if:
        op: le
        left:
          variable: score
        right:
          value: 0
    - id: test
      label: test1.
      next: choose_test
      visible_if:
        op: eq
        left:
          variable: ending_seen
        right:
          value: true
  say:
    type: bgm
    action: start
    asset: bgm.test1
    volume: 0.5
    duration_ms: 500
    await: false
    next: enter_jelly
  say_2:
    type: say
    speaker: test
    text: >-
      对正数 $x,y$，$\frac{x+y}{2} \ge \sqrt{xy}$， 因为
      $x+y-2\sqrt{xy}=(\sqrt{x}-\sqrt{y})^2 \ge 0$，所以二元均值不等式成立。
    speed_cps: null
    next: flash_result
