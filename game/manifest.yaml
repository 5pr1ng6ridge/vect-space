    display_name: Alli
    name_color: "#B3FFCC"
    text_color: "#000000"
    expressions:
      neutral:
        asset: sprite.alli_neutral
        anchor_x: 0.5
        anchor_y: 1.0
        offset_x: 0.0
        offset_y: 0.0
        scale: 1.0
      smug:
        asset: sprite.alli_smug
        anchor_x: 0.5
        anchor_y: 1.0
        offset_x: 0.0
        offset_y: 4.0
        scale: 1.0
      surprise:
        asset: sprite.alli_surprise
        anchor_x: 0.5
        anchor_y: 1.0
        offset_x: 0.0
        offset_y: 2.0
        scale: 1.0
    default_expression: neutral
    default_scale: 0.78
  sat:
    display_name: Sat
    name_color: "#FFA3EE"
    text_color: "#000000"
    expressions:
      smile:
        asset: sprite.sat_smile
        anchor_x: 0.5
        anchor_y: 1.0
        offset_x: 0.0
        offset_y: 0.0
        scale: 1.0
      smug:
        asset: sprite.sat_smug
        anchor_x: 0.5
        anchor_y: 1.0
        offset_x: 0.0
        offset_y: 0.0
        scale: 1.0
      soft:
        asset: sprite.sat_soft
        anchor_x: 0.5
        anchor_y: 1.0
        offset_x: 0.0
        offset_y: 0.0
        scale: 1.0
    default_expression: smile
    default_scale: 0.68
  test:
    display_name: 测试角色
    name_color: "#1D5C78"
    text_color: "#17213A"
    expressions: {}
    default_scale: 1.0
