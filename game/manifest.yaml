schema_version: 2
content_version: demo-2
entry_scene: prologue
default_locale: zh-CN
variables:
  route:
    scope: save
    type: string
    default: ""
  score:
    scope: save
    type: integer
    default: 0
  ending_seen:
    scope: profile
    type: boolean
    default: false
assets:
  bg.vector_space:
    kind: background
    path: backgrounds/bg_vstest.png
  font.fusion_pixel:
    kind: font
    path: fonts/fusion-pixel-12px-monospaced-zh_hans.ttf
  gui.dialogue_box:
    kind: gui
    path: gui/diaboxtest.png
  gui.name_box:
    kind: gui
    path: gui/nameboxtest.png
  sfx.typing:
    kind: sfx
    path: audio/sfx_typing.wav
  sprite.jelly:
    kind: sprite
    path: sprites/jelly.png
scenes:
- scenes/prologue.yaml
